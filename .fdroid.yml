AutoName: Proyecto UTTEC - Gestión y Herramientas
Categories:
  - Connectivity
  - Utilities
License: MIT
SourceCode: https://github.com/user/proyecto10ids1
IssueTracker: https://github.com/user/proyecto10ids1/issues

Summary: Gestión de clientes, clasificaciones, PokéAPI, directorio y escáner QR.

Description: |-
  Aplicación móvil integral desarrollada con Flutter para la gestión
  administrativa y herramientas de apoyo interactivo.

  Características principales:
  - Autenticación y Registro con correo y contraseña.
  - Módulo de Clientes: Registro y administración en tiempo real.
  - Módulo de Clasificaciones.
  - Explorador de PokéAPI.
  - Directorio de contactos para envío de WhatsApp.
  - Escáner de Códigos de Barras y Códigos QR (motor libre ZXing).

AntiFeatures:
  NonFreeNet:
    en-US: The app connects to external services (PokéAPI and Supabase) to fetch data and authenticate.

